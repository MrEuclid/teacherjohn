<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- This meta tag is crucial for mobile screens so it doesn't look zoomed out -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Checkout</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .checkout-card {
      background: white;
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      padding: 30px 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      margin-top: 40px;
    }
    .item-name {
      font-size: 22px;
      color: #333;
      margin-bottom: 10px;
    }
    .item-price {
      font-size: 36px;
      font-weight: bold;
      color: #000;
      margin-bottom: 30px;
    }
    .pay-button {
      background-color: #000;
      color: white;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      padding: 15px;
      width: 100%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .pay-button:active {
      background-color: #333;
    }
    .error-state {
      color: red;
      display: none;
    }
  </style>
</head>
<body>

  <div class="checkout-card">
    <!-- This is where we will inject the data from the URL -->
    <div id="error-message" class="error-state">No item data found in URL.</div>
    <div id="checkout-content">
      <div class="item-name" id="display-name">Loading...</div>
      <div class="item-price" id="display-price">$0.00</div>
      
      <button class="pay-button" onclick="processPayment()">
        <!-- A simple wallet icon SVG -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        Pay with Wallet
      </button>
    </div>
  </div>

  <script>
    // 1. Grab the raw URL query string (e.g., "?id=101&name=University%20Hoodie&price=45")
    const queryString = window.location.search;
    
    // 2. Pass it into URLSearchParams to make it easy to extract variables
    const urlParams = new URLSearchParams(queryString);

    // 3. Extract the specific pieces of data we need
    const itemName = urlParams.get('name');
    const itemPrice = urlParams.get('price');
    const itemId = urlParams.get('id');

    // 4. Update the HTML to show the customer what they are paying for
    if (itemName && itemPrice) {
      document.getElementById('display-name').innerText = itemName;
      
      // Convert the price string to a number and format it with 2 decimal places
      const formattedPrice = parseFloat(itemPrice).toFixed(2);
      document.getElementById('display-price').innerText = "$" + formattedPrice;
    } else {
      // If someone opens this page without scanning a QR code, hide the checkout and show an error
      document.getElementById('checkout-content').style.display = 'none';
      document.getElementById('error-message').style.display = 'block';
    }

    // 5. Simulate the payment process
    function processPayment() {
      // In a real app, this button would trigger the Apple Pay / Google Pay sheet,
      // and then send the successful payment token to your backend server.
      
      const btn = document.querySelector('.pay-button');
      btn.innerText = "Processing...";
      btn.style.backgroundColor = "#555";
      
      setTimeout(() => {
        btn.style.backgroundColor = "#28a745"; // Turn green
        btn.innerText = "Payment Successful!";
        alert(`Successfully paid $${parseFloat(itemPrice).toFixed(2)} for ${itemName}! \n\n(In a real system, the server would now notify the POS screen.)`);
      }, 1500);
    }
  </script>

</body>
</html>
