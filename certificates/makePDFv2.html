<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML to PDF Conversion</title>
    <meta charset="utf-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .controls {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        #content {
            padding: 20px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }

        img { display: inline-block; }
        .line {
            width: 100%;
            height: 10em;
            border-bottom: 1px solid black;
        }
        .name {
            margin-top: -8em;
            font-weight: bold;
        }
        #status-message {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center mb-4">Generate Certificates from CSV</h1>

        <div class="controls">
            <div class="mb-3">
                <label for="csvFile" class="form-label">Upload CSV File:</label>
                <input class="form-control" type="file" id="csvFile" accept=".csv" required>
            </div>
            <button id="generateButton" class="btn btn-primary w-100">Generate All PDFs</button>
            <div id="status-message"></div>
        </div>

        <!-- The certificate template to be converted to PDF -->
        <div id="content" class="my-4">
            <div class="container">
                <div class="row">
                    <div class="col-12 text-center">
                        <img id="certificateLogo" src="https://placehold.co/100x100?text=LOGO" alt="Student Photo" class="mb-3">
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 text-center">
                        <p class="h3">Awarded to</p>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 text-center">
                        <p id="person" class="h1">
                            <span id="firstName"></span>
                            <span id="familyName"></span>
                            <span id="grade"></span>
                        </p>
                    </div>
                </div>
                <div class="row">
                    <div class="col-4 text-center">
                        <div class="line"></div>
                    </div>
                    <div class="col-4 text-center"></div>
                    <div class="col-4 text-center">
                        <div class="line"></div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-4 text-center">
                        <p class="text-center name">Mean Malyda</p>
                    </div>
                    <div class="col-4 text-center"></div>
                    <div class="col-4 text-center">
                        <p class="text-center name">John Thompson</p>
                    </div>
                </div>
            </div> <!-- container -->
        </div> <!-- content -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const generateButton = document.getElementById('generateButton');
            const csvFile = document.getElementById('csvFile');
            const statusMessage = document.getElementById('status-message');
            const personNameElement = document.getElementById('person');
            const certificateLogo = document.getElementById('certificateLogo');

            generateButton.addEventListener('click', () => {
                if (csvFile.files.length === 0) {
                    statusMessage.textContent = 'Please select a CSV file first.';
                    statusMessage.style.color = 'red';
                    return;
                }

                const file = csvFile.files[0];
                const reader = new FileReader();

                reader.onload = async function(event) {
                    const csvText = event.target.result;
                    const records = parseCSV(csvText);
                    statusMessage.textContent = `Found ${records.length} records. Generating PDFs...`;
                    statusMessage.style.color = 'blue';

                    // --- IMPORTANT: Your browser may block subsequent downloads.
                    // Please allow pop-ups for this site if you only get one PDF.
                    // ---
                    for (let i = 0; i < records.length; i++) {
                        const record = records[i];
                        if (record.studentID) {
                            // Update the HTML content with the current record's data
                            document.getElementById('firstName').textContent = record.firstName || '';
                            document.getElementById('familyName').textContent = record.familyName || '';
                            document.getElementById('grade').textContent = record.grade || '';
                            
                            // Use the photo field from the CSV for the image source
                            if (record.photo) {
                                certificateLogo.src = record.photo;
                            } else {
                                // Fallback image if no photo link is provided
                                certificateLogo.src = 'https://placehold.co/100x100?text=NO+PHOTO';
                            }
                            
                            // Re-build the full name and grade for the H1 tag
                            personNameElement.textContent = `${record.familyName || ''} ${record.firstName || ''} ${record.grade || ''}`;

                            // Generate the PDF for the current record
                            const element = document.getElementById('content');
                            const filename = `${record.studentID}_${record.familyName || ''}_${record.firstName || ''}.pdf`;
                            await html2pdf().set({
                                filename: filename,
                                html2canvas: { scale: 2 },
                                jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
                            }).from(element).save();

                            statusMessage.textContent = `Generated PDF ${i + 1} of ${records.length}: ${filename}`;
                        }
                    }

                    statusMessage.textContent = `PDF generation complete for all records!`;
                    statusMessage.style.color = 'green';
                };

                reader.readAsText(file);
            });

            // A simple CSV parser that handles the provided file format
            function parseCSV(csvString) {
                const lines = csvString.split('\n');
                const headers = lines[0].split(',').map(header => header.trim().replace(/\"/g, ''));
                const records = [];

                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.length > 0) {
                        const values = line.split(',').map(value => value.trim().replace(/\"/g, ''));
                        const record = {};
                        for (let j = 0; j < headers.length; j++) {
                            record[headers[j]] = values[j] || '';
                        }
                        records.push(record);
                    }
                }
                return records;
            }
        });
    </script>
</body>
</html>
