<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML to PDF Conversion (jQuery)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .controls {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        #content {
            padding: 20px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }

        img { display: inline-block; width:120px; height:auto; }

        .line {
            width: 100%;
            height: 5em;
            border-bottom: 2px solid black;
        }
        .name {
            margin-top: -2em;
            font-weight: bold;
        }
        #status-message {
            margin-top: 10px;
            font-weight: bold;
        }

        /* Hide the container that holds the content for the single PDF */
        #pdf-container {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center mb-4">Generate Certificates from CSV</h1>

        <div class="controls">
            <div class="mb-3">
                <label for="csvFile" class="form-label">Upload CSV File:</label>
                <input class="form-control" type="file" id="csvFile" accept=".csv" required>
            </div>
            <button id="generateButton" class="btn btn-primary w-100">Generate All PDFs</button>
            <div id="status-message"></div>
        </div>

        <!-- The certificate template to be converted to PDF -->
        <div id="content" class="my-4">
            <div class="container">
                <div class="row">
                    <div class="col-12 text-left">
                        <img id="certificateLogo" src="https://placehold.co/100x100?text=LOGO" alt="Student Photo" class="mb-3">
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 text-center">
                        <p class = "h1">Certificate of Completion</p>
                        <p class = "h2">Introduction Accounting</p>
                        <p class="h3">Awarded to</p>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 text-center">
                        <!-- We now use classes for dynamic content to avoid ID conflicts -->
                        <p class="person-name h1">
                            <span class="firstName"></span>
                            <span class="familyName"></span>
                            <span class="grade"></span>
                        </p>
                    </div>
                </div>
                <div class="row">
                    <div class="col-4 text-center">
                        <div class="line"></div>
                    </div>
                    <div class="col-4 text-center"></div>
                    <div class="col-4 text-center">
                        <div class="line"></div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-4 text-center">
                        <p class="text-center name">Mean Malyda</p>
                    </div>
                    <div class="col-4 text-center"></div>
                    <div class="col-4 text-center">
                        <p class="text-center name">John Thompson</p>
                    </div>
                </div>
            </div> <!-- container -->
        </div> <!-- content -->
    </div>
    
    <!-- This hidden container will hold all certificates for a single PDF -->
    <div id="pdf-container"></div>

    <script>
        $(document).ready(function() {
            const generateButton = $('#generateButton');
            const csvFile = $('#csvFile');
            const statusMessage = $('#status-message');
            const certificateLogo = $('#certificateLogo');
            const pdfContainer = $('#pdf-container');
            const contentTemplate = $('#content');

            generateButton.on('click', function() {
                if (csvFile[0].files.length === 0) {
                    statusMessage.text('Please select a CSV file first.').css('color', 'red');
                    return;
                }

                const file = csvFile[0].files[0];
                const reader = new FileReader();

                reader.onload = async function(event) {
                    const csvText = event.target.result;
                    const records = parseCSV(csvText);
                    statusMessage.text(`Found ${records.length} records. Preparing for single PDF generation...`).css('color', 'blue');
                    
                    // Clear the container before adding new content
                    pdfContainer.empty();

                    for (let i = 0; i < records.length; i++) {
                        const record = records[i];
                        if (record.studentID) {
                            // Create a clone of the certificate template for this record
                            // We also use a class here to mark it for page-breaking
                            const certificateClone = contentTemplate.clone().removeAttr('id').addClass('certificate-page');
                            
                            // Update the content within the clone using the new class selectors
                            certificateClone.find('.firstName').text(record.firstName || '');
                            certificateClone.find('.familyName').text(record.familyName || '');
                            certificateClone.find('.grade').text(record.grade || '');
                            
                            // Re-build the full name and grade using the new class selector for the parent element
                            certificateClone.find('.person-name').text(`${record.familyName || ''} ${record.firstName || ''} ${record.grade || ''}`);

                            // Use the photo field from the CSV for the image source
                            if (record.photo) {
                                // We keep the ID for the logo since there's only one in the template
                                certificateClone.find('#certificateLogo').attr('src', record.photo);
                            } else {
                                // Fallback image if no photo link is provided
                                certificateClone.find('#certificateLogo').attr('src', 'https://placehold.co/100x100?text=NO+PHOTO');
                            }
                            
                            // Append the updated clone to the hidden container
                            pdfContainer.append(certificateClone);

                            statusMessage.text(`Added record ${i + 1} of ${records.length} to PDF content.`);

                            // A small delay to let the images load and content render
                            await new Promise(resolve => setTimeout(resolve, 50));
                        }
                    }

                    // Now, generate a single PDF from the entire container
                    statusMessage.text(`Generating single PDF... Please wait.`).css('color', 'green');
                    const element = pdfContainer[0];
                    await html2pdf().set({
                        filename: 'All_Certificates.pdf',
                        html2canvas: { scale: 2 },
                        jsPDF: { unit: 'in', format: 'letter', orientation: 'landscape' },
                        pagebreak: { mode: ['css', 'avoid-all'], before: '.certificate-page' }
                    }).from(element).save();

                    statusMessage.text(`PDF generation complete!`).css('color', 'green');
                };

                reader.readAsText(file);
            });

            // A simple CSV parser that handles the provided file format
            function parseCSV(csvString) {
                const lines = csvString.split('\n');
                const headers = lines[0].split(',').map(header => header.trim().replace(/\"/g, ''));
                const records = [];

                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.length > 0) {
                        const values = line.split(',').map(value => value.trim().replace(/\"/g, ''));
                        const record = {};
                        for (let j = 0; j < headers.length; j++) {
                            record[headers[j]] = values[j] || '';
                        }
                        records.push(record);
                    }
                }
                return records;
            }
        });
    </script>
</body>
</html>
