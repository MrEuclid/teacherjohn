<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML to PDF Conversion (jQuery)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .controls {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        #content {
            padding: 20px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }

        img { display: inline-block; width:120px; height:auto; }

        .line {
            width: 100%;
            height: 5em;
            border-bottom: 2px solid black;
        }
        .name {
            margin-top: -2em;
            font-weight: bold;
        }
        #status-message {
            margin-top: 10px;
            font-weight: bold;
        }

        /* Hide the container using display: none and show it only for printing */
        #pdf-container {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center mb-4">Generate Certificates from CSV</h1>

        <div class="controls">
            <div class="mb-3">
                <label for="csvFile" class="form-label">Upload CSV File:</label>
                <input class="form-control" type="file" id="csvFile" accept=".csv" required>
            </div>
            <button id="generateButton" class="btn btn-primary w-100">Generate All PDFs</button>
            <div id="status-message"></div>
        </div>

        <!-- The certificate template to be converted to PDF -->
        <div id="content" class="my-4">
            <div class="container">
                <div class="row">
                    <div class="col-12 text-left">
                        <!-- Changed to a class since this will be cloned -->
                        <img class="certificateLogo" src="https://placehold.co/100x100?text=LOGO" alt="Student Photo" class="mb-3">
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 text-center">
                        <p class = "h1">Certificate of Completion</p>
                        <p class = "h2">Introduction Accounting</p>
                        <p class="h3">Awarded to</p>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 text-center">
                        <!-- A single div to hold the full name and grade -->
                        <div class="fullName h1"></div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-4 text-center">
                        <div class="line"></div>
                    </div>
                    <div class="col-4 text-center"></div>
                    <div class="col-4 text-center">
                        <div class="line"></div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-4 text-center">
                        <p class="text-center name">Mean Malyda</p>
                    </div>
                    <div class="col-4 text-center"></div>
                    <div class="col-4 text-center">
                        <p class="text-center name">John Thompson</p>
                    </div>
                </div>
            </div> <!-- container -->
        </div> <!-- content -->
    </div>
    
    <!-- This hidden container will hold all certificates for a single PDF -->
    <div id="pdf-container"></div>

    <script>
        $(document).ready(function() {
            const generateButton = $('#generateButton');
            const csvFile = $('#csvFile');
            const statusMessage = $('#status-message');
            const pdfContainer = $('#pdf-container');
            const contentTemplate = $('#content');

            generateButton.on('click', async function() {
                if (csvFile[0].files.length === 0) {
                    statusMessage.text('Please select a CSV file first.').css('color', 'red');
                    return;
                }

                const file = csvFile[0].files[0];
                const reader = new FileReader();

                reader.onload = async function(event) {
                    const csvText = event.target.result;
                    const records = parseCSV(csvText);
                    console.log('--- CSV PARSING LOG ---');
                    console.log('Parsed Records:', records);
                    console.log('-----------------------');

                    if (records.length === 0) {
                        statusMessage.text('CSV file is empty or could not be parsed.').css('color', 'red');
                        return;
                    }
                    
                    statusMessage.text(`Found ${records.length} records. Preparing for single PDF generation...`).css('color', 'blue');
                    
                    // Clear the container before adding new content
                    pdfContainer.empty();

                    // Loop through each record and create a full certificate for it
                    for (let i = 0; i < records.length; i++) {
                        const record = records[i];
                        // Check if a record exists and has a student ID before processing
                        if (record.studentID && record.studentID.trim() !== '') {
                            console.log(`Processing student: ${record.firstName} ${record.familyName}`);
                            
                            // Create a full, populated clone of the certificate template for this record
                            const certificateClone = contentTemplate.clone().removeAttr('id').addClass('certificate-page');
                            
                            // Correctly update the full name and grade using a single element
                            let fullName = `${record.familyName || ''} ${record.firstName || ''} ${record.grade || ''}`.trim();
                            certificateClone.find('.fullName').text(fullName);
                            
                            // Use the photo field from the CSV for the image source
                            if (record.photo) {
                                certificateClone.find('.certificateLogo').attr('src', record.photo);
                            } else {
                                // Fallback image if no photo link is provided
                                certificateClone.find('.certificateLogo').attr('src', 'https://placehold.co/100x100?text=NO+PHOTO');
                            }
                            
                            // Append the updated clone to the hidden container
                            pdfContainer.append(certificateClone);
                            console.log(`Appended certificate for ${fullName} to container.`);

                            statusMessage.text(`Added record ${i + 1} of ${records.length} to PDF content.`);

                            // A small delay to let the images load and content render
                            await new Promise(resolve => setTimeout(resolve, 50));
                        }
                    }

                    // Log the final content of the container before generation
                    console.log('Final HTML content of PDF container:', pdfContainer.html());
                    
                    // Now, generate a single PDF from the entire container
                    statusMessage.text(`Generating single PDF... Please wait.`).css('color', 'green');
                    
                    // Temporarily make the container visible for a brief moment before PDF generation
                    pdfContainer.css('display', 'block');
                    const element = pdfContainer[0];

                    await html2pdf().set({
                        filename: 'All_Certificates.pdf',
                        html2canvas: { scale: 2 },
                        jsPDF: { unit: 'in', format: 'letter', orientation: 'landscape' },
                        pagebreak: { mode: ['css', 'avoid-all'], before: '.certificate-page' }
                    }).from(element).save();

                    // Hide the container again after generation is complete
                    pdfContainer.css('display', 'none');

                    statusMessage.text(`PDF generation complete!`).css('color', 'green');
                };

                reader.readAsText(file);
            });

            // A more robust CSV parser that handles quotes and commas in fields, and accounts for trailing commas
            function parseCSV(csvString) {
                const records = [];
                const lines = csvString.split(/\r?\n/);
                const headers = lines[0].split(',').map(header => header.trim().replace(/^"|"$/g, ''));
                
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.length > 0) {
                        const values = line.split(',').map(value => value.trim().replace(/^"|"$/g, ''));
                        // Check if the number of values is equal to the headers, or one more due to a trailing comma
                        if (values.length >= headers.length) {
                            const record = {};
                            for (let j = 0; j < headers.length; j++) {
                                record[headers[j]] = values[j] || '';
                            }
                            records.push(record);
                        }
                    }
                }
                return records;
            }
        });
    </script>
</body>
</html>
