<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML to PDF Conversion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .controls {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        .certificate-template {
            padding: 20px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }
        img { display: inline-block; width:120px; height:auto; }
        .line {
            width: 100%;
            height: 5em;
            border-bottom: 2px solid black;
        }
        .name {
            margin-top: -2em;
            font-weight: bold;
        }
        #status-message {
            margin-top: 10px;
            font-weight: bold;
        }
        /* This is the only item we will hide/show */
        #content-wrapper {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center mb-4">Generate Certificates from CSV</h1>
        <div class="controls">
            <div class="mb-3">
                <label for="csvFile" class="form-label">Upload CSV File:</label>
                <input class="form-control" type="file" id="csvFile" accept=".csv" required>
            </div>
            <button id="generateButton" class="btn btn-primary w-100">Generate All PDFs</button>
            <div id="status-message"></div>
        </div>
    </div>

    <!-- The template and content to be converted -->
    <div id="content-wrapper">
        <div class="certificate-template">
            <div class="container">
                <div class="row">
                    <div class="col-12 text-left">
                        <img class="certificateLogo" src="https://placehold.co/100x100?text=LOGO" alt="Student Photo" class="mb-3">
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 text-center">
                        <p class="h1">Certificate of Completion</p>
                        <p class="h2">Introduction Accounting</p>
                        <p class="h3">Awarded to</p>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 text-center">
                        <div class="fullName h1"></div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-4 text-center">
                        <div class="line"></div>
                    </div>
                    <div class="col-4 text-center"></div>
                    <div class="col-4 text-center">
                        <div class="line"></div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-4 text-center">
                        <p class="text-center name">Mean Malyda</p>
                    </div>
                    <div class="col-4 text-center"></div>
                    <div class="col-4 text-center">
                        <p class="text-center name">John Thompson</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            const generateButton = $('#generateButton');
            const csvFile = $('#csvFile');
            const statusMessage = $('#status-message');
            const contentWrapper = $('#content-wrapper');
            const certificateTemplate = contentWrapper.find('.certificate-template').clone();

            generateButton.on('click', async function() {
                if (csvFile[0].files.length === 0) {
                    statusMessage.text('Please select a CSV file first.').css('color', 'red');
                    return;
                }
                const file = csvFile[0].files[0];
                const reader = new FileReader();

                reader.onload = async function(event) {
                    try {
                        const csvText = event.target.result;
                        const records = parseCSV(csvText);
                        
                        console.log('--- CSV PARSING LOG ---');
                        console.log('Parsed Records:', records);
                        console.log('-----------------------');

                        if (records.length === 0) {
                            statusMessage.text('CSV file is empty or could not be parsed.').css('color', 'red');
                            return;
                        }
                        
                        statusMessage.text(`Found ${records.length} records. Beginning PDF generation...`).css('color', 'blue');
                        
                        for (let i = 0; i < records.length; i++) {
                            const record = records[i];
                            if (record.studentID && record.studentID.trim() !== '') {
                                const fullName = `${record.familyName || ''} ${record.firstName || ''} ${record.grade || ''}`.trim();
                                
                                statusMessage.text(`Generating PDF ${i + 1} of ${records.length} for: ${fullName}`).css('color', 'blue');
                                console.log(`Processing record ${i + 1} of ${records.length}: ${fullName}`);
                                
                                const certificateClone = certificateTemplate.clone();
                                certificateClone.find('.fullName').text(fullName);
                                
                                let photoUrl = record.photo;
                                if (photoUrl && (photoUrl.startsWith('images/') || photoUrl.startsWith('file://'))) {
                                    console.warn(`Warning: Image path is local (${photoUrl}). It will not be visible in the PDF. Using placeholder instead.`);
                                    photoUrl = 'https://placehold.co/120x120?text=NO+PHOTO';
                                    statusMessage.text(`Warning: Image for ${fullName} is a local path. Using a placeholder.`).css('color', 'orange');
                                }

                                const certificateLogo = certificateClone.find('.certificateLogo');
                                certificateLogo.attr('src', photoUrl || 'https://placehold.co/120x120?text=NO+PHOTO');
                                
                                // Temporarily put the certificate into the DOM for rendering
                                contentWrapper.empty().append(certificateClone).show();

                                const filename = `${record.studentID}_${fullName.replace(/\s/g, '_')}.pdf`;

                                // Generate and save a single PDF
                                await html2pdf().set({
                                    filename: filename,
                                    html2canvas: { scale: 2 },
                                    jsPDF: { unit: 'in', format: 'letter', orientation: 'landscape' },
                                }).from(certificateClone[0]).save();

                                // Hide the container again
                                contentWrapper.hide();
                            }
                        }
                        statusMessage.text(`PDF generation complete! All files saved.`).css('color', 'green');
                    } catch (error) {
                        console.error('An error occurred during PDF generation:', error);
                        statusMessage.text(`An error occurred: ${error.message}`).css('color', 'red');
                    }
                };
                reader.readAsText(file);
            });

            function parseCSV(csvString) {
                const records = [];
                const lines = csvString.split(/\r?\n/).filter(line => line.trim().length > 0);
                if (lines.length === 0) return records;
                const headers = lines[0].split(',').map(header => header.trim().replace(/^"|"$/g, ''));
                
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.length > 0) {
                        const values = line.split(',').map(value => value.trim().replace(/^"|"$/g, ''));
                        if (values.length >= headers.length) {
                            const record = {};
                            for (let j = 0; j < headers.length; j++) {
                                record[headers[j]] = values[j] || '';
                            }
                            records.push(record);
                        }
                    }
                }
                return records;
            }
        });
    </script>
</body>
</html>
