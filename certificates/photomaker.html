<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #4f46e5;
            animation: spin 1s ease infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-xl shadow-lg p-6 md:p-10 max-w-2xl w-full text-center">
        <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">AI Image Generator</h1>
        <p class="text-gray-500 mb-6 md:mb-8">
            Click the button below to generate an image of a Cambodian high school student's ID photo.
        </p>

        <button id="generateBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            Generate Image
        </button>

        <div id="loading" class="mt-8 flex justify-center items-center hidden">
            <div class="spinner"></div>
            <span class="ml-4 text-gray-500 font-medium">Generating image...</span>
        </div>

        <div id="image-container" class="mt-8">
            <!-- Generated image will be displayed here -->
        </div>

        <div id="error-message" class="mt-4 text-red-500 font-medium hidden">
            An error occurred. Please try again.
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const generateBtn = document.getElementById('generateBtn');
            const loadingIndicator = document.getElementById('loading');
            const imageContainer = document.getElementById('image-container');
            const errorMessage = document.getElementById('error-message');

            const apiKey = ""; // Canvas will provide this automatically

            const prompt = "ID photo of a Cambodian high school student, studio lighting, neutral background, simple formal uniform, realistic photo.";

            async function generateImage() {
                // Show loading state and hide previous results
                generateBtn.disabled = true;
                loadingIndicator.classList.remove('hidden');
                imageContainer.innerHTML = '';
                errorMessage.classList.add('hidden');

                const payload = {
                    instances: {
                        prompt: prompt
                    },
                    parameters: {
                        sampleCount: 1
                    }
                };

                // Correctly append the API key to the endpoint URL
                const API_ENDPOINT = `https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:predict?key=${apiKey}`;

                let attempt = 0;
                const maxAttempts = 5;
                let response;

                while (attempt < maxAttempts) {
                    try {
                        response = await fetch(API_ENDPOINT, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(payload)
                        });

                        if (response.status === 429) {
                            const delay = Math.pow(2, attempt) * 1000;
                            attempt++;
                            await new Promise(resolve => setTimeout(resolve, delay));
                            continue;
                        }

                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }

                        const result = await response.json();
                        const base64Data = result?.predictions?.[0]?.bytesBase64Encoded;

                        if (!base64Data) {
                            throw new Error('No image data received.');
                        }

                        const imageUrl = `data:image/jpeg;base64,${base64Data}`;
                        const imgElement = document.createElement('img');
                        imgElement.src = imageUrl;
                        imgElement.classList.add('rounded-lg', 'shadow-md', 'w-full', 'max-w-xs', 'mx-auto', 'transition-opacity', 'duration-500', 'opacity-0');
                        imgElement.onload = () => {
                            imgElement.classList.remove('opacity-0');
                        };
                        imageContainer.appendChild(imgElement);

                        break; // Exit the loop on success

                    } catch (e) {
                        console.error("Fetch error:", e);
                        errorMessage.textContent = `Error: ${e.message}`;
                        errorMessage.classList.remove('hidden');
                        break; // Exit the loop on unrecoverable error
                    } finally {
                        loadingIndicator.classList.add('hidden');
                        generateBtn.disabled = false;
                    }
                }
            }

            generateBtn.addEventListener('click', generateImage);
        });
    </script>
</body>
</html>
