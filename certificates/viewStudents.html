<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data Viewer</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f9;
        }
        .container {
            max-width: 960px;
            margin-top: 2rem;
            margin-bottom: 2rem;
        }
        .card {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        .card-img-top {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-top-left-radius: 0.5rem;
            border-top-right-radius: 0.5rem;
        }
        .placeholder-image {
            background-color: #e9ecef;
            color: #6c757d;
            font-size: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="text-center mb-4">Student Records Viewer</h1>
        
        <!-- Filter Section -->
        <div id="filter-section" class="mb-4 p-4 bg-white rounded shadow-sm">
            <div class="row">
                <div class="col-md-6">
                    <label for="gradeFilter" class="form-label">Filter by Grade:</label>
                    <select id="gradeFilter" class="form-select">
                        <!-- Options will be populated by JavaScript -->
                    </select>
                </div>
            </div>
        </div>

        <!-- Status Message -->
        <div id="statusMessage" class="text-center mb-4"></div>

        <!-- Student Data Display Area -->
        <div id="studentData" class="row g-4">
            <!-- Student cards will be dynamically added here -->
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // Initial data load when the page is ready
            fetchStudents();

            // Event listener for the grade filter dropdown
            $('#gradeFilter').on('change', function() {
                // Fetch data again with the new filter
                fetchStudents($('#gradeFilter').val());
            });

            // Function to fetch student data from the database
            function fetchStudents(grade = 'all') {
                const statusMessage = $('#statusMessage');
                const studentDataContainer = $('#studentData');
                
                statusMessage.removeClass('text-success text-danger').text('Loading student records...').addClass('text-info');
                studentDataContainer.empty();

                // Make an AJAX call to the PHP file
                $.ajax({
                    url: 'fetch_students.php',
                    type: 'GET',
                    dataType: 'json',
                    data: { grade: grade },
                    success: function(records) {
                        if (records.error) {
                            statusMessage.text(`An error occurred: ${records.error}`).addClass('text-danger');
                            return;
                        }
                        
                        // Populate the grade filter only on the initial load (when grade is 'all')
                        if (grade === 'all') {
                             populateGradeFilter(records);
                        }

                        // Display the students
                        displayStudents(records);
                        statusMessage.text(`Successfully loaded ${records.length} student records.`).addClass('text-success');

                    },
                    error: function(xhr, status, error) {
                        console.error("AJAX Error:", status, error);
                        statusMessage.text(`Failed to load data. Please check the server connection.`).addClass('text-danger');
                    }
                });
            }

            // Function to populate the grade filter dropdown
            function populateGradeFilter(records) {
                const gradeFilter = $('#gradeFilter');
                gradeFilter.empty(); // Clear previous options
                gradeFilter.append(`<option value="all">All Grades</option>`);

                // Get unique grades from the records
                const grades = [...new Set(records.map(record => record.grade))].sort();
                grades.forEach(grade => {
                    if (grade) {
                        gradeFilter.append(`<option value="${grade}">${grade}</option>`);
                    }
                });
            }

            // Function to display students
            function displayStudents(studentsToDisplay) {
                const studentDataContainer = $('#studentData');
                studentDataContainer.empty();
                
                if (studentsToDisplay.length === 0) {
                    studentDataContainer.append(`<div class="col-12 text-center text-muted mt-5">No students found for this grade.</div>`);
                    return;
                }

                studentsToDisplay.forEach(record => {
                    const fullName = `${record.familyName} ${record.firstName} ${record.studentID}`;
                    const photoUrl = record.photo;

                    // Create a Bootstrap card for each student
                    const cardHtml = `
                        <div class="col-12 col-sm-6 col-md-4">
                            <div class="card h-100 rounded-3">
                                ${photoUrl ? `<img src="${photoUrl}" class="card-img-top" alt="${fullName}">` : `<div class="card-img-top placeholder-image d-flex align-items-center justify-content-center" style="height: 250px;">No Photo</div>`}
                                <div class="card-body">
                                    <h5 class="card-title">${fullName}</h5>
                                    <p class="card-text"><strong>Grade:</strong> ${record.grade}</p>
                                </div>
                            </div>
                        </div>
                    `;
                    studentDataContainer.append(cardHtml);
                });
            }
        });
    </script>
    <!-- Bootstrap JS (optional, but good practice) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
