<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Three - Math Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 20px;
            transition: background-color 0.3s;
        }
        
        /* Scoreboard */
        #scoreboard {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(6, 70px);
            gap: 8px;
            justify-content: center;
            margin: 20px auto;
        }
        .cell {
            width: 70px;
            height: 70px;
            background-color: #fff;
            border: 2px solid #ccc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            user-select: none;
            transition: all 0.2s ease-in-out;
        }
        
        /* Claimed Token Colors */
        .p1 { background-color: #ffb3ba !important; border-color: #ff4d4d !important; color: #cc0000 !important; }
        .p2 { background-color: #bae1ff !important; border-color: #4d94ff !important; color: #0000cc !important; }
        
        /* Dynamic Hover Effect based on whose turn it is */
        body.turn-p1 .cell:not(.p1):not(.p2):hover {
            background-color: #ffe6e8;
            border-color: #ff4d4d;
            color: #ff4d4d;
        }
        body.turn-p2 .cell:not(.p1):not(.p2):hover {
            background-color: #e6f2ff;
            border-color: #4d94ff;
            color: #4d94ff;
        }

        /* Upgraded Player Badges */
        #status { font-size: 22px; margin: 15px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .p1-badge { background-color: #ffb3ba; color: #cc0000; padding: 6px 16px; border-radius: 6px; border: 2px solid #ff4d4d; font-weight: bold; }
        .p2-badge { background-color: #bae1ff; color: #0000cc; padding: 6px 16px; border-radius: 6px; border: 2px solid #4d94ff; font-weight: bold; }

        .controls { margin-bottom: 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            color: white;
            border: none;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }
        button:disabled { background-color: #ccc !important; cursor: not-allowed; box-shadow: none; }
        
        .btn-green { background-color: #4CAF50; }
        .btn-green:hover:not(:disabled) { background-color: #45a049; }
        
        .btn-blue { background-color: #2196F3; }
        .btn-blue:hover:not(:disabled) { background-color: #1e88e5; }
        
        .btn-red { background-color: #f44336; }
        .btn-red:hover:not(:disabled) { background-color: #e53935; }
        
        /* Numbered Square Dice Styling */
        #dice-display { 
            font-size: 24px; 
            min-height: 50px; 
            margin: 15px; 
            color: #333; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .die {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            background-color: #fff;
            border: 2px solid #333;
            border-radius: 10px;
            font-size: 26px;
            color: #333;
            margin: 0 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body class="turn-p1">

    <h2>Connect Three</h2>
    
    <div id="scoreboard">
        <div class="p1-badge">Player 1 Score: <span id="score1">0</span></div>
        <div class="p2-badge">Player 2 Score: <span id="score2">0</span></div>
    </div>

    <div id="status"></div>
    
    <div class="controls">
        <button id="roll-btn" class="btn-green" onclick="rollDice()">Roll Dice</button>
        <button id="new-game-btn" class="btn-blue" onclick="resetGame()">New Game</button>
        <button id="reset-score-btn" class="btn-red" onclick="resetScores()">Reset Scores</button>
    </div>
    
    <div id="dice-display"></div>

    <div class="board" id="board"></div>

<script>
    let currentPlayer = 1;
    let currentRoll = [];
    let boardState = Array(18).fill(0); // Indices 0-17 map to numbers -5 to 12
    let p1Score = 0;
    let p2Score = 0;

    function initBoard() {
        const boardDiv = document.getElementById('board');
        boardDiv.innerHTML = '';
        for (let i = -5; i <= 12; i++) {
            let cell = document.createElement('div');
            cell.className = 'cell';
            cell.id = 'cell-' + i;
            cell.innerText = i;
            cell.onclick = () => attemptMove(i);
            boardDiv.appendChild(cell);
        }
        updateStatusDisplay('start');
    }

    function updateScoreBoard() {
        document.getElementById('score1').innerText = p1Score;
        document.getElementById('score2').innerText = p2Score;
    }

    function resetGame() {
        boardState = Array(18).fill(0);
        currentPlayer = 1;
        currentRoll = [];
        initBoard();
        document.getElementById('roll-btn').disabled = false;
        document.getElementById('dice-display').innerHTML = '';
    }

    function resetScores() {
        if(confirm("Are you sure you want to reset the scores to 0?")) {
            p1Score = 0;
            p2Score = 0;
            updateScoreBoard();
            resetGame();
        }
    }

    function updateStatusDisplay(state) {
        const statusEl = document.getElementById('status');
        const badgeClass = currentPlayer === 1 ? 'p1-badge' : 'p2-badge';
        const playerNameBadge = `<span class="${badgeClass}">Player ${currentPlayer}</span>`;
        
        document.body.className = currentPlayer === 1 ? 'turn-p1' : 'turn-p2';

        if (state === 'start') {
            statusEl.innerHTML = `${playerNameBadge} <span>'s Turn to Roll</span>`;
        } else if (state === 'rolling') {
            statusEl.innerHTML = `${playerNameBadge} <span>, select your answer!</span>`;
        } else if (state === 'win') {
            statusEl.innerHTML = `${playerNameBadge} <span> Wins!</span>`;
            document.body.className = ''; 
        } else if (state === 'draw') {
            statusEl.innerHTML = `<strong>Game Over - It's a draw! No possible moves left.</strong>`;
            document.body.className = ''; 
        }
    }

    function rollDice() {
        let d1, d2, validAnswers, hasValidMove;
        let attempts = 0;
        
        do {
            d1 = Math.floor(Math.random() * 6) + 1;
            d2 = Math.floor(Math.random() * 6) + 1;
            validAnswers = [d1 + d2, d1 - d2, d2 - d1];
            
            hasValidMove = validAnswers.some(ans => {
                let index = ans + 5;
                return index >= 0 && index <= 17 && boardState[index] === 0;
            });
            
            attempts++;
            if (attempts > 100) break;
            
        } while (!hasValidMove);

        if (!hasValidMove) {
            updateStatusDisplay('draw');
            document.getElementById('dice-display').innerHTML = "";
            document.getElementById('roll-btn').disabled = true;
            return;
        }

        currentRoll = [d1, d2];
        document.getElementById('dice-display').innerHTML = `Rolled: <span class="die">${d1}</span> and <span class="die">${d2}</span>`;
        updateStatusDisplay('rolling');
        document.getElementById('roll-btn').disabled = true;
    }

    function attemptMove(targetNumber) {
        if (currentRoll.length === 0) return; 
        
        const d1 = currentRoll[0];
        const d2 = currentRoll[1];
        const validAnswers = [d1 + d2, d1 - d2, d2 - d1];

        if (!validAnswers.includes(targetNumber)) {
            alert("Incorrect! You must use + or - with your rolled numbers.");
            return;
        }

        const arrayIndex = targetNumber + 5; 
        if (boardState[arrayIndex] !== 0) {
            alert("That square is already taken!");
            return;
        }

        boardState[arrayIndex] = currentPlayer;
        const cell = document.getElementById('cell-' + targetNumber);
        cell.classList.add(currentPlayer === 1 ? 'p1' : 'p2');

        if (checkWin(arrayIndex)) {
            if (currentPlayer === 1) p1Score++; else p2Score++;
            updateScoreBoard();
            updateStatusDisplay('win');
            document.getElementById('dice-display').innerHTML = "Game Over - Click New Game to play again.";
            currentRoll = [];
            return;
        }

        currentPlayer = currentPlayer === 1 ? 2 : 1;
        currentRoll = [];
        updateStatusDisplay('start');
        document.getElementById('roll-btn').disabled = false;
        document.getElementById('dice-display').innerHTML = '';
    }

    function checkWin(lastIndex) {
        const row = Math.floor(lastIndex / 6);
        const col = lastIndex % 6;
        let consecutive = 0;
        
        // Horizontal
        for (let i = row * 6; i < (row * 6) + 6; i++) {
            if (boardState[i] === currentPlayer) {
                consecutive++;
                if (consecutive === 3) return true;
            } else { consecutive = 0; }
        }

        consecutive = 0;
        // Vertical
        for (let i = col; i < 18; i += 6) {
            if (boardState[i] === currentPlayer) {
                consecutive++;
                if (consecutive === 3) return true;
            } else { consecutive = 0; }
        }

        return false;
    }

    initBoard();
</script>

</body>
</html>
