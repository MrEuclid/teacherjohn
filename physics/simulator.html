<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinematics Simulator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #container {
            display: flex;
            background-color: #34495e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            gap: 20px;
        }
        #sidebar {
            width: 260px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        canvas {
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            border-radius: 5px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        .panel {
            background-color: #2c3e50;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #7f8c8d;
        }
        h2 { margin-top: 0; font-size: 1.1rem; color: #f1c40f; border-bottom: 1px solid #7f8c8d; padding-bottom: 5px; }
        label { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; align-items: center; }
        input[type="number"] {
            width: 80px;
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #bdc3c7;
            background-color: #ecf0f1;
            font-size: 1rem;
            text-align: right;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-family: monospace;
            font-size: 1.1rem;
        }
        .btn-group { display: flex; gap: 10px; }
        button {
            flex: 1;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.2s;
        }
        #btn-launch { background-color: #2ecc71; }
        #btn-launch:hover { background-color: #27ae60; }
        #btn-reset { background-color: #e74c3c; }
        #btn-reset:hover { background-color: #c0392b; }
        .highlight { color: #3498db; font-weight: bold; }
    </style>
</head>
<body>

<div id="container">
    <div id="sidebar">
        <div class="panel">
            <h2>Launch Parameters</h2>
            <label>Velocity (m/s): <input type="number" id="in-velo" value="20" step="0.5"></label>
            <label>Angle (degrees): <input type="number" id="in-angle" value="45" step="1"></label>
            <label>Gravity (m/s²): <input type="number" id="in-gravity" value="9.8" step="0.1"></label>
        </div>

        <div class="btn-group">
            <button id="btn-launch" onclick="launchProjectile()">Launch!</button>
            <button id="btn-reset" onclick="resetSimulation()">Reset</button>
        </div>

        <div class="panel">
            <h2>Flight Data</h2>
            <div class="data-row"><span>Time:</span> <span id="out-time" class="highlight">0.00 s</span></div>
            <div class="data-row"><span>Max Height:</span> <span id="out-height" class="highlight">0.00 m</span></div>
            <div class="data-row"><span>Distance:</span> <span id="out-dist" class="highlight">0.00 m</span></div>
        </div>
        
        <div class="panel" style="text-align: center; color: #ecf0f1; font-size: 0.9rem;">
            Goal: Land the projectile on the 🐷 at exactly <strong>35 meters</strong>.
        </div>
    </div>

    <canvas id="simCanvas" width="800" height="500"></canvas>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const inVelo = document.getElementById('in-velo');
    const inAngle = document.getElementById('in-angle');
    const inGravity = document.getElementById('in-gravity');
    const outTime = document.getElementById('out-time');
    const outHeight = document.getElementById('out-height');
    const outDist = document.getElementById('out-dist');
    const btnLaunch = document.getElementById('btn-launch');

    // Physics & Scale Constants
    const PIXELS_PER_METER = 18; 
    const GROUND_Y = 430;
    const SLING_ANCHOR_X = 80;
    const SLING_ANCHOR_Y = 380;
    const TARGET_DIST_METERS = 35; 

    // Simulation State
    let state = 'idle'; // idle, flying, landed
    let birdX = SLING_ANCHOR_X;
    let birdY = SLING_ANCHOR_Y;
    
    // Kinematic Variables
    let v0x = 0;
    let v0y = 0;
    
    // Flight Tracking
    let flightStartTime = 0;
    let currentTime = 0;
    let maxHeight = 0;
    let successMessage = false;

    function launchProjectile() {
        if (state === 'flying') return; // Prevent multiple clicks

        const v0 = parseFloat(inVelo.value);
        const thetaDeg = parseFloat(inAngle.value);
        const thetaRad = thetaDeg * (Math.PI / 180);

        // Decompose vectors
        v0x = v0 * Math.cos(thetaRad);
        v0y = v0 * Math.sin(thetaRad); 

        state = 'flying';
        flightStartTime = Date.now();
        maxHeight = 0;
        successMessage = false;
        
        btnLaunch.disabled = true;
        btnLaunch.style.backgroundColor = '#95a5a6';
    }

    function resetSimulation() {
        state = 'idle';
        birdX = SLING_ANCHOR_X;
        birdY = SLING_ANCHOR_Y;
        outTime.innerText = '0.00 s';
        outHeight.innerText = '0.00 m';
        outDist.innerText = '0.00 m';
        successMessage = false;
        
        btnLaunch.disabled = false;
        btnLaunch.style.backgroundColor = '#2ecc71';
    }

    function drawScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Ground
        ctx.fillStyle = '#7cb342';
        ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
        ctx.fillStyle = '#558b2f';
        ctx.fillRect(0, GROUND_Y, canvas.width, 15);

        // Draw Clouds (Decoration)
        ctx.font = '40px Arial';
        ctx.fillText('☁️', 150, 100);
        ctx.fillText('☁️', 450, 150);
        ctx.fillText('☁️', 650, 80);

        // Draw Target Pig
        const targetPx = SLING_ANCHOR_X + (TARGET_DIST_METERS * PIXELS_PER_METER);
        ctx.font = '35px Arial';
        ctx.fillText('🐷', targetPx - 17, GROUND_Y + 5);
        // Distance marker
        ctx.fillStyle = '#2c3e50';
        ctx.font = '14px Arial';
        ctx.fillText('35m', targetPx - 15, GROUND_Y + 25);

        // Draw Slingshot
        ctx.font = '50px Arial';
        ctx.fillText('🪵', SLING_ANCHOR_X - 25, SLING_ANCHOR_Y + 45);

        // Draw Bird
        ctx.font = '35px Arial';
        // Adjust emoji center
        ctx.fillText('😡', birdX - 17, birdY + 12); 

        // Draw Success Message
        if (successMessage) {
            ctx.fillStyle = '#f1c40f';
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 4;
            ctx.font = 'bold 50px Arial';
            const msg = "Well done!";
            const txtWidth = ctx.measureText(msg).width;
            ctx.strokeText(msg, (canvas.width/2) - (txtWidth/2), 200);
            ctx.fillText(msg, (canvas.width/2) - (txtWidth/2), 200);
        }
    }

    // Main Engine Loop
    function update() {
        const g = parseFloat(inGravity.value);

        if (state === 'flying') {
            currentTime = (Date.now() - flightStartTime) / 1000; 
            
            let xMeters = v0x * currentTime;
            let yMeters = v0y * currentTime - 0.5 * g * currentTime * currentTime;

            birdX = SLING_ANCHOR_X + (xMeters * PIXELS_PER_METER);
            birdY = SLING_ANCHOR_Y - (yMeters * PIXELS_PER_METER);

            if (yMeters > maxHeight) maxHeight = yMeters;

            // Collision with ground
            if (birdY >= GROUND_Y - 15) { 
                birdY = GROUND_Y - 15;
                state = 'landed';
                
                // Calculate precise landing metrics using the quadratic formula
                let h0 = (GROUND_Y - SLING_ANCHOR_Y - 15) / PIXELS_PER_METER;
                let preciseTime = (-v0y - Math.sqrt(v0y*v0y - 4 * (-0.5*g) * h0)) / (-g);
                let finalDistance = v0x * preciseTime;

                outTime.innerText = preciseTime.toFixed(2) + ' s';
                outDist.innerText = finalDistance.toFixed(2) + ' m';
                outHeight.innerText = maxHeight.toFixed(2) + ' m';

                // Check if they reached the goal (allow 1 meter margin of error)
                if (Math.abs(finalDistance - TARGET_DIST_METERS) < 1.0) {
                    successMessage = true;
                }
            } else {
                outTime.innerText = currentTime.toFixed(2) + ' s';
                outDist.innerText = xMeters.toFixed(2) + ' m';
                outHeight.innerText = maxHeight.toFixed(2) + ' m';
            }
        }

        drawScene();
        requestAnimationFrame(update);
    }

    // Initialize
    drawScene();
    update();
</script>
</body>
</html>
