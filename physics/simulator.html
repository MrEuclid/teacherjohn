<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Kinematics Simulator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #container {
            display: flex;
            background-color: #34495e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            gap: 20px;
        }
        #sidebar {
            width: 260px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        canvas {
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            border-radius: 5px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        .panel {
            background-color: #2c3e50;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #7f8c8d;
        }
        h2 { margin-top: 0; font-size: 1.1rem; color: #f1c40f; border-bottom: 1px solid #7f8c8d; padding-bottom: 5px; }
        label { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; align-items: center; }
        input[type="number"] {
            width: 80px;
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #bdc3c7;
            background-color: #ecf0f1;
            font-size: 1rem;
            text-align: right;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-family: monospace;
            font-size: 1rem;
        }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        button {
            flex: 1;
            min-width: 45%;
            padding: 10px;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: background 0.2s;
        }
        #btn-launch { background-color: #2ecc71; }
        #btn-launch:hover { background-color: #27ae60; }
        #btn-reset { background-color: #e74c3c; }
        #btn-reset:hover { background-color: #c0392b; }
        #btn-random { background-color: #9b59b6; flex-basis: 100%; }
        #btn-random:hover { background-color: #8e44ad; }
        .highlight { color: #3498db; font-weight: bold; }
        .target-hl { color: #f1c40f; font-weight: bold; }
        .stars-hl { color: #f39c12; font-size: 1.2rem; }
    </style>
</head>
<body>

<div id="container">
    <div id="sidebar">
        
        <div class="panel">
            <h2>Scoreboard</h2>
            <div class="data-row"><span>Total Stars:</span> <span id="out-total-stars" class="stars-hl">0</span></div>
            <div class="data-row"><span>Attempts:</span> <span id="out-attempts">0</span></div>
        </div>

        <div class="panel">
            <h2>Launch Parameters</h2>
            <label>Velocity (m/s): <input type="number" id="in-velo" value="22" step="0.5"></label>
            <label>Angle (degrees): <input type="number" id="in-angle" value="45" step="1"></label>
            <label>Gravity (m/s²): <input type="number" id="in-gravity" value="9.8" step="0.1"></label>
        </div>

        <div class="btn-group">
            <button id="btn-launch" onclick="launchProjectile()">Launch!</button>
            <button id="btn-reset" onclick="resetSimulation()">Reset Sling</button>
            <button id="btn-random" onclick="randomizeTarget()">New Random Target</button>
        </div>

        <div class="panel">
            <h2>Target Mission</h2>
            <div class="data-row"><span>Launch Height (y₀):</span> <span class="target-hl">2.0 m</span></div>
            <div class="data-row"><span>Target Dist (x):</span> <span id="out-target-x" class="target-hl">30.0 m</span></div>
            <div class="data-row"><span>Target Height (y):</span> <span id="out-target-y" class="target-hl">12.0 m</span></div>
        </div>

        <div class="panel">
            <h2>Live Flight Data</h2>
            <div class="data-row"><span>Time:</span> <span id="out-time" class="highlight">0.00 s</span></div>
            <div class="data-row"><span>Distance (x):</span> <span id="out-dist" class="highlight">0.00 m</span></div>
            <div class="data-row"><span>Height (y):</span> <span id="out-height" class="highlight">2.00 m</span></div>
        </div>
    </div>

    <canvas id="simCanvas" width="800" height="580"></canvas>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const inVelo = document.getElementById('in-velo');
    const inAngle = document.getElementById('in-angle');
    const inGravity = document.getElementById('in-gravity');
    const outTime = document.getElementById('out-time');
    const outHeight = document.getElementById('out-height');
    const outDist = document.getElementById('out-dist');
    const outTargetX = document.getElementById('out-target-x');
    const outTargetY = document.getElementById('out-target-y');
    const outAttempts = document.getElementById('out-attempts');
    const outTotalStars = document.getElementById('out-total-stars');
    const btnLaunch = document.getElementById('btn-launch');

    // Physics & Scale Constants
    const PIXELS_PER_METER = 15;
    const GROUND_Y = 530;
    const SLING_ANCHOR_X = 60;
    const LAUNCH_HEIGHT_M = 2.0;
    const SLING_ANCHOR_Y = GROUND_Y - (LAUNCH_HEIGHT_M * PIXELS_PER_METER);

    // Target Variables
    let targetDistM = 30.0;
    let targetHeightM = 12.0;
    const HIT_RADIUS_M = 1.5; 

    // Score Tracking Variables
    let attempts = 0;
    let totalStars = 0;
    let earnedStars = 0;
    let targetDefeated = false;

    // Simulation State
    let state = 'idle'; // idle, flying, landed
    let birdX = SLING_ANCHOR_X;
    let birdY = SLING_ANCHOR_Y;
    
    // Kinematic Variables
    let v0x = 0;
    let v0y = 0;
    let flightStartTime = 0;
    let currentTime = 0;
    let successMessage = false;

    function randomizeTarget() {
        // Distance between 20m and 45m
        targetDistM = Math.floor(Math.random() * 26) + 20; 
        // Height between 0m and 22m
        targetHeightM = Math.floor(Math.random() * 23); 
        
        outTargetX.innerText = targetDistM.toFixed(1) + ' m';
        outTargetY.innerText = targetHeightM.toFixed(1) + ' m';
        
        // Reset Scores for the new target
        attempts = 0;
        earnedStars = 0;
        targetDefeated = false;
        outAttempts.innerText = attempts;

        resetSimulation();
    }

    function launchProjectile() {
        if (state === 'flying' || targetDefeated) return; 

        const v0 = parseFloat(inVelo.value);
        const thetaDeg = parseFloat(inAngle.value);
        const thetaRad = thetaDeg * (Math.PI / 180);

        v0x = v0 * Math.cos(thetaRad);
        v0y = v0 * Math.sin(thetaRad); 

        state = 'flying';
        flightStartTime = Date.now();
        successMessage = false;
        
        // Increment attempts on launch
        attempts++;
        outAttempts.innerText = attempts;

        btnLaunch.disabled = true;
        btnLaunch.style.backgroundColor = '#95a5a6';
    }

    function resetSimulation() {
        state = 'idle';
        birdX = SLING_ANCHOR_X;
        birdY = SLING_ANCHOR_Y;
        outTime.innerText = '0.00 s';
        outDist.innerText = '0.00 m';
        outHeight.innerText = LAUNCH_HEIGHT_M.toFixed(2) + ' m';
        successMessage = targetDefeated; // Keep success message up if they already beat it
        
        if (!targetDefeated) {
            btnLaunch.disabled = false;
            btnLaunch.style.backgroundColor = '#2ecc71';
        }
    }

    function drawScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Ground
        ctx.fillStyle = '#7cb342';
        ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
        ctx.fillStyle = '#558b2f';
        ctx.fillRect(0, GROUND_Y, canvas.width, 15);

        // Calculate Target Pixel Coordinates
        const targetPxX = SLING_ANCHOR_X + (targetDistM * PIXELS_PER_METER);
        const targetPxY = GROUND_Y - (targetHeightM * PIXELS_PER_METER);

        // Draw Platform if target is elevated
        if (targetHeightM > 0) {
            ctx.fillStyle = '#8d6e63'; 
            ctx.fillRect(targetPxX - 15, targetPxY + 15, 30, targetHeightM * PIXELS_PER_METER);
            ctx.strokeStyle = '#5d4037';
            ctx.lineWidth = 2;
            ctx.strokeRect(targetPxX - 15, targetPxY + 15, 30, targetHeightM * PIXELS_PER_METER);
        }

        // Draw Target Pig (Change to dead pig if defeated)
        ctx.font = '30px Arial';
        ctx.fillText(targetDefeated ? '💥' : '🐷', targetPxX - 15, targetPxY + 12);

        // Draw Slingshot 
        ctx.font = '40px Arial';
        ctx.fillText('🪵', SLING_ANCHOR_X - 20, SLING_ANCHOR_Y + 35);
        ctx.fillStyle = '#795548';
        ctx.fillRect(SLING_ANCHOR_X - 5, SLING_ANCHOR_Y + 30, 10, LAUNCH_HEIGHT_M * PIXELS_PER_METER - 30);

        // Draw Bird
        ctx.font = '30px Arial';
        ctx.fillText('😡', birdX - 15, birdY + 10); 

        // Draw Success Message & Stars
        if (successMessage) {
            ctx.fillStyle = '#f1c40f';
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 4;
            ctx.font = 'bold 55px Arial';
            
            const msg = "Target Hit!";
            const txtWidth = ctx.measureText(msg).width;
            ctx.strokeText(msg, (canvas.width/2) - (txtWidth/2), 150);
            ctx.fillText(msg, (canvas.width/2) - (txtWidth/2), 150);

            // Draw Stars Earned
            let starsRender = "";
            for (let i = 0; i < earnedStars; i++) starsRender += "⭐";
            ctx.font = '45px Arial';
            const starWidth = ctx.measureText(starsRender).width;
            ctx.fillText(starsRender, (canvas.width/2) - (starWidth/2), 210);
        }
    }

    function update() {
        const g = parseFloat(inGravity.value);

        if (state === 'flying') {
            currentTime = (Date.now() - flightStartTime) / 1000; 
            
            let xMeters = v0x * currentTime;
            let yMeters = LAUNCH_HEIGHT_M + (v0y * currentTime) - (0.5 * g * currentTime * currentTime);

            birdX = SLING_ANCHOR_X + (xMeters * PIXELS_PER_METER);
            birdY = GROUND_Y - (yMeters * PIXELS_PER_METER);

            // Collision Detection
            let dxMeters = xMeters - targetDistM;
            let dyMeters = yMeters - targetHeightM;
            let distanceFromTargetM = Math.hypot(dxMeters, dyMeters);

            if (distanceFromTargetM <= HIT_RADIUS_M) {
                // Direct Hit
                state = 'landed';
                successMessage = true;
                
                // Snap bird to target visually upon hit
                birdX = SLING_ANCHOR_X + (targetDistM * PIXELS_PER_METER);
                birdY = GROUND_Y - (targetHeightM * PIXELS_PER_METER);
                
                // Award stars if not already defeated
                if (!targetDefeated) {
                    targetDefeated = true;
                    if (attempts === 1) earnedStars = 3;
                    else if (attempts === 2) earnedStars = 2;
                    else earnedStars = 1;
                    
                    totalStars += earnedStars;
                    outTotalStars.innerText = totalStars;
                }

                outTime.innerText = currentTime.toFixed(2) + ' s';
                outDist.innerText = targetDistM.toFixed(2) + ' m';
                outHeight.innerText = targetHeightM.toFixed(2) + ' m';

            } else if (birdY >= GROUND_Y - 10) { 
                // Hit ground (Miss)
                birdY = GROUND_Y - 10;
                state = 'landed';
                
                outTime.innerText = currentTime.toFixed(2) + ' s';
                outDist.innerText = xMeters.toFixed(2) + ' m';
                outHeight.innerText = '0.00 m';
                
                // Allow them to reset and try again
                btnLaunch.disabled = false;
                btnLaunch.style.backgroundColor = '#2ecc71';
            } else {
                // Flight update
                outTime.innerText = currentTime.toFixed(2) + ' s';
                outDist.innerText = xMeters.toFixed(2) + ' m';
                outHeight.innerText = yMeters.toFixed(2) + ' m';
            }
        }

        drawScene();
        requestAnimationFrame(update);
    }

    // Initialize
    drawScene();
    update();
</script>
</body>
</html>
