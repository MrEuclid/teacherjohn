  <script>

    function makeNumber()

    {
      var max = 9 ;
      var min = 1 ;
      var numbers = [] ;

 var digit = Math.floor(Math.random() * (max - min) + min);
 numbers.push(digit);

 for (var i = 0 ; i <= 3 ; i++)
 {
   var duplicate = true;
   digit = Math.floor(Math.random() * (max - min) + min);
   while (duplicate == true)

   {
    digit = Math.floor(Math.random() * (max - min) + min);
     var index = numbers.indexOf(digit) ;
     if (index != -1) {duplicate = true;} else {duplicate = false;}
   }
   numbers[i] = digit ;
 }


 return numbers ;
    }
  </script>
