<!-- scripts for functions used in the app -->

<script type="text/javascript">
  function displayButtons(n)

  {
for (var i = 1 ; i <= n ;i++)
{

$('#grid').append('<button id = \"buttonPandemic'+i+ '\" +   >S</button>');

// $('#grid').append('<button>S</button>');
if (i % 10 == 0) {$('#grid').append('<br>') ;}

}
}
</script>

<script type="text/javascript">
// returns a random integer between min and max
  function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}
</script>

<script>
$(document).ready(function(){

people = [[]] ;

for (var i = 0 ; i <= 100 ;)
{
  
  people[i][0] = "S";  //state of person 
  people[i][1] = 0 ;  // cycle when they became infected
}

displayButtons(100);

alert(people);

})

</script>

<style>

  [id^=buttonPandemic] {width: 20px ; height: 20px; margin: 5px 5px 5px 5px ; background-color: green; font-size: 0.8em}

  </style>

</head>

<body>
  <div class  = "container-fluid">

<div class = "row">
<div class = "col-sm-12 ">
  <h2 class = "c">Pandemic Question</h2>
  <p>There are 1000 people at a meeting. When a person herars a joke they want to share it with two other people. They do that once every 10 minutes, There is only one, very funny joke, that is told.
</div></div>


<div class = "row">
<div class = "col-sm-12 ">
  <h3 class =  "c">Spreading the joke. </h3> 
</div></div>


<div class = "row">
<div class = "col-sm-12 c">
  <button id = "newCycle"></button> 
  <label>Susceptible<label id = "susceptible"></label>
  <label>Infected<label id = "infected"></label>
</div></div>

<div class = "row">
<div class = "col-sm-12 ">
  <p id = "grid"></p>
</div></div>



</body>
