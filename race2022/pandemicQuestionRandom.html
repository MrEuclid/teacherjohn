<script>
$(document).ready(function(){


// alert("loading document ");

populationSize = 2000 ;
recoveryTime = 4 ;
probTransmission = 1;  // level of infectiousness
//numberContacts = 1 ; // average number of contacts per person per day
reproductionFactor = 1; 
percentImmune = 10 ;

$('#populationSize').attr('value',populationSize);
$('#recoveryTime').attr('value',recoveryTime);
//$('#numberContacts').attr('value',numberContacts);
$('#probTransmission').attr('value',probTransmission);
$('#percentImmune').attr('value',percentImmune);
$('#reproductionFactor').attr('value',reproductionFactor);
  
stats = [[]] ; //   records data each time interval ;
people = [] ;
person = {};
$('#newCycle').hide() ;

for (var i = 0 ; i < populationSize ; i++)
{
  // make the crowd
person = {
            "status": "S",   // from S,I,R,N
            "idN":i ,
            "timeInfected": 0 ,
            "timeRecovered": 0,
            "socialDistance": 0
          } ;

people.push(person) ;

}
makeButtons(populationSize);
// 4.table(people);
})

</script>

<script>
      $(document).ready(function(){
    $('#start').on('click', function()
  {

time = 0;
// make one infection
// alert('Starting') ;

// make some people immune
var numberPeople = parseInt(people.length) ;
var percentImmune = parseInt($('#percentImmune').val()) ;
var numberImmune = Math.floor(percentImmune * numberPeople / 100);
// console.log('Initially immune',numberImmune,numberPeople,percentImmune);
var cnt = 0 ;
while (cnt < numberImmune)
{
var n = getRandomInt(0,numberPeople-1);
var status = people[n].status ;
if (status != "N") 
  {
    people[n].status = "N" ; 
    cnt++;
  }


}

// add initial infections 
var cnt = 0 ;
var initialInfections = 1 ;
while (cnt < initialInfections)
{
var n = getRandomInt(0,numberPeople-1);
var status = people[n].status ;
if (status != "N") 
  {
    people[n].status = "I" ; 
    people[n].timeInfected = time ;
    cnt++;
  }
}

// everyone else should be left as susceptible
clones = people.slice() ;
displayButtons(clones);

})
})

</script>


<script>
      $(document).ready(function(){
    $('#newCycle2').on('click', function()
  {

//alert('New cycle');
// spreading the infecton
// simple case is that it must be an uninfected person
// more complex calculations based on several paprameters

time++ ;

// check for recovery before new infections 
// console.table(people);


var recoveryPool = people.filter(function(p) {return (time - p.timeInfected)  >= recoveryTime & p.status == "I"});

console.log('Number recovered ' + recoveryPool.length);

// set recover first before dealing with new infections
var recoveryL = recoveryPool.length ;
if (recoveryL > 0)

{
  for (var i = 0 ; i < recoveryL; i++)
  {
    recoveredID = recoveryPool[i].idN ;
    people[recoveredID].status = "R";
    people[recoveredID].timeRecovered = time;
  }
}

var susceptiblePool = people.filter(function(p) {return p.status == "S" });
var numberSusceptible = susceptiblePool.length;

var infectedPool = people.filter(function(p) {return p.status == "I" });
var numberInfected = infectedPool.length;

var numberVictims = Math.floor(numberInfected*probTransmission) + 1 ;

// use people 
// contact regardless of status 
console.log('victims ',numberVictims);
for (var i = 1 ; i <= numberVictims; i++ )
{
var n = getRandomInt(0,populationSize-1) ; // choose someone at random
var status = people[n].status;
if (status == "S")
  {
    people[n].status = "I" ;
    people[n].timeInfected = time ;
  }

}
clones = people.slice() ;
displayButtons(clones);
})
})
</script>
